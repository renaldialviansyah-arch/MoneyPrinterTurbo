name: Android Pipeline Smoke Test
on:
  push:
    branches: [android-mobile-work]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Render and QC synthetic video
        run: python scripts/android_render_smoke_test.py
