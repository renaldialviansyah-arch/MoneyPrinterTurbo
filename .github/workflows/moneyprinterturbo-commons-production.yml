name: MoneyPrinterTurbo Ollama Production
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic"
        required: true
        default: "The Lost City of Petra"
      language:
        description: "Video script language"
        required: true
        default: "en-US"
      aspect:
        description: "Orientation"
        type: choice
        options: [portrait, landscape]
        default: portrait
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: android-mobile-work
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          python -m pip install --upgrade pip uv
          uv pip install --system --overrides requirements-security.txt -r requirements.txt
      - name: Install and start Ollama
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/version >/dev/null || { cat /tmp/ollama.log; exit 1; }
      - name: Pull local model
        run: |
          set -euo pipefail
          ollama pull qwen3:4b
          ollama list
      - name: Configure Ollama provider and preflight inference
        run: |
          set -euo pipefail
          cp config.example.toml config.toml
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path("config.toml")
          text=p.read_text()
          updates={
            "llm_provider": 'llm_provider = "ollama"',
            "ollama_base_url": 'ollama_base_url = "http://127.0.0.1:11434/v1"',
            "ollama_model_name": 'ollama_model_name = "qwen3:4b"',
          }
          for key,value in updates.items():
            pattern=rf"(?m)^{key}\s*=.*$"
            if not re.search(pattern,text):
              raise SystemExit(f"Config key not found: {key}")
            text=re.sub(pattern,value,text,count=1)
          p.write_text(text)
          print("Ollama config verified; provider and model set.")
          PY
          python - <<'PY'
          from openai import OpenAI
          client=OpenAI(base_url="http://127.0.0.1:11434/v1", api_key="ollama", timeout=180, max_retries=0)
          result=client.chat.completions.create(model="qwen3:4b",messages=[{"role":"user","content":"Reply with exactly the word READY."}],temperature=0)
          content=result.choices[0].message.content if result.choices else ""
          if not content or not content.strip(): raise SystemExit("SDK preflight returned empty output")
          print("OpenAI SDK preflight passed; response:",content.strip()[:120])
          PY
          # Confirm the CLI configuration actually contains the same provider/base URL/model.
          python - <<'PY'
          import tomllib
          from pathlib import Path
          c=tomllib.loads(Path("config.toml").read_text())
          # MoneyPrinterTurbo stores runtime settings under the [app] section.
          app=c.get("app", c)
          expected={"llm_provider":"ollama","ollama_base_url":"http://127.0.0.1:11434/v1","ollama_model_name":"qwen3:4b"}
          for k,v in expected.items():
            if app.get(k)!=v: raise SystemExit(f"CLI config mismatch for {k}: {app.get(k)!r}")
          print("CLI config audit passed: provider, URL, and model match the SDK preflight.")
          PY
      - name: Preflight through MoneyPrinterTurbo LLM service
        run: |
          set -euo pipefail
          python - <<'PY'
          from app.services.llm import _generate_response
          from app.config import config
          cfg=config.app
          print("Provider:",cfg.get("llm_provider"))
          print("Configured Ollama model:",cfg.get("ollama_model_name"))
          print("Configured Ollama URL:",cfg.get("ollama_base_url"))
          result=_generate_response("Reply with exactly PREFLIGHT_OK",request_timeout=120,max_retries=0)
          if not result or "PREFLIGHT_OK" not in result:
            raise SystemExit("MoneyPrinterTurbo LLM service preflight failed: unexpected response")
          print("MoneyPrinterTurbo service-level LLM preflight passed.")
          PY
      - name: Generate narrative and scene-specific Pixabay assets
        env:
          TOPIC: ${{ inputs.topic }}
          LANGUAGE: ${{ inputs.language }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ASPECT: ${{ inputs.aspect }}
        run: |
          set -euo pipefail
          mkdir -p commons_assets output
          python - <<'PY'
          import urllib.request, urllib.parse, urllib.error, json, re, subprocess, os, time, html, tempfile
          from pathlib import Path
          from openai import OpenAI

          topic=os.environ['TOPIC']
          language=os.environ['LANGUAGE']
          if 'petra' not in topic.lower():
            raise SystemExit('This evidence-led test workflow is scoped to Petra. Set the topic to The Lost City of Petra.')
          headers={'User-Agent':'MoneyPrinterTurboCommonsWorkflow/8.0 (documentary video asset retrieval)'}
          def fetch(url,tries=5):
            for attempt in range(tries):
              try:
                with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=45) as response:
                  return response.read()
              except urllib.error.HTTPError as e:
                if e.code==429 or 500<=e.code<600:
                  retry=e.headers.get('Retry-After','')
                  try: delay=min(90,max(5,int(retry))) if retry else min(60,5*(2**attempt))
                  except ValueError: delay=min(60,5*(2**attempt))
                  print(f'HTTP {e.code}; retry {attempt+1}/{tries} after {delay}s')
                  if attempt==tries-1: raise
                  time.sleep(delay)
                else:
                  raise
              except Exception as e:
                print(f'Network retry {attempt+1}/{tries}: {type(e).__name__}: {e}')
                if attempt==tries-1: raise
                time.sleep(min(45,4*(2**attempt)))
            raise RuntimeError('HTTP retries exhausted')

          # Evidence pack for this Petra test, based on UNESCO and official Petra sources.
          petra_facts=[
            "Petra was the rock-cut capital of the Nabataeans in southern Jordan, between the Red Sea and the Dead Sea.",
            "Petra became a major caravan crossroads linking Arabia, Egypt, and Syria-Phoenicia; trade included Arabian incense, Chinese silk, and Indian spices.",
            "The Siq is a winding natural sandstone gorge leading to Petra; the famous Al-Khazneh facade is carved into the rock and is a monumental tomb.",
            "Nabataean water engineering used channels, tunnels, dams, aqueducts, cisterns, and reservoirs to collect, divert, and store water in an arid landscape.",
            "Petra contains remains from Nabataean, Roman, and Byzantine periods, including a colonnaded street, theatre, temples, churches, and tombs.",
            "Petra was inscribed on the UNESCO World Heritage List in 1985; its sandstone monuments face erosion and require ongoing conservation."
          ]
          fallback=[
            {'voiceover':"In southern Jordan, a city was carved into rose-red sandstone. Petra became the remarkable capital of the Nabataeans.",'visual_query':'Petra Jordan aerial view rose red sandstone archaeological city'},
            {'voiceover':"Its narrow Siq gorge opens toward Al-Khazneh, the famous rock-cut monumental tomb. The route made the landscape part of the city experience.",'visual_query':'Petra Siq narrow sandstone gorge Al Khazneh Treasury facade'},
            {'voiceover':"Petra was more than a dramatic façade. Caravan routes connected Arabia with Egypt and Syria, carrying incense, silk, and spices through this trading crossroads.",'visual_query':'Petra Nabataean caravan trade ancient incense silk spices archaeological relief'},
            {'voiceover':"Survival in this dry landscape depended on engineering. Channels, tunnels, dams, and cisterns captured and stored precious water.",'visual_query':'Petra Nabataean ancient water channels cistern dam hydraulic engineering'},
            {'voiceover':"The city changed across centuries. Nabataean monuments stand alongside Roman and Byzantine remains, including streets, a theatre, temples, and churches.",'visual_query':'Petra archaeological colonnaded street Roman theatre Byzantine church ruins'},
            {'voiceover':"Petra did not simply disappear. Inscribed as a World Heritage Site in 1985, its sandstone monuments still need protection from erosion.",'visual_query':'Petra Jordan Ad Deir Monastery Royal Tombs sandstone conservation archaeology'}
          ]

          def extract_json(raw):
            raw=(raw or '').strip()
            raw=re.sub(r'^\x60{3}(?:json)?\s*','',raw,flags=re.I)
            raw=re.sub(r'\s*\x60{3}$','',raw)
            first=raw.find('{')
            if first<0: raise ValueError('No JSON object found in model response')
            depth=0; quoted=False; escaped=False
            for pos,ch in enumerate(raw[first:],first):
              if quoted:
                if escaped: escaped=False
                elif ch=='\\': escaped=True
                elif ch=='"': quoted=False
              else:
                if ch=='"': quoted=True
                elif ch=='{': depth+=1
                elif ch=='}':
                  depth-=1
                  if depth==0: return json.loads(raw[first:pos+1])
            raise ValueError('JSON object is incomplete')

          scenes=fallback
          try:
            prompt=f"""Return one JSON object matching this schema exactly:
          {{"scenes":[{{"voiceover":"...","visual_query":"..."}}]}}
          Documentary topic: {topic}
          Narration language: {language}
          Build a fact-led six-scene short specifically about Petra, Jordan. Use only the evidence below; do not invent details:
          1. Petra is the Nabataean rock-cut capital in southern Jordan, between the Red Sea and Dead Sea.
          2. It became a caravan crossroads linking Arabia, Egypt, and Syria-Phoenicia; trade included Arabian incense, Chinese silk, and Indian spices.
          3. The Siq is a winding natural sandstone gorge leading to Petra. Al-Khazneh is a monumental rock-cut tomb facade.
          4. Nabataean water infrastructure included channels, tunnels, diversion dams, aqueducts, cisterns, and reservoirs.
          5. Petra preserves Nabataean, Roman, and Byzantine remains, including a colonnaded street, theatre, temples, and churches.
          6. Petra entered the UNESCO World Heritage List in 1985. Its sandstone monuments face erosion and require conservation.
          Exactly 6 scenes, in this order: location and hook; Siq and Al-Khazneh; caravan trade; water engineering; later Roman/Byzantine layers; heritage and conservation.
          Each voiceover: 1-2 natural spoken sentences. Total 100-140 words. No generic filler, false claims that Petra is entirely lost or abandoned, unsupported dates, quotes, or statistics.
          Each visual_query must name the actual Petra subject in that scene (Siq, Al-Khazneh, Nabataean water channels, colonnaded street, theatre, Byzantine church, Ad-Deir, Royal Tombs). Avoid unrelated generic historical imagery.
          Output JSON only, no markdown or explanation."""
            payload=json.dumps({'model':'qwen3:4b','stream':False,'format':'json','think':False,'options':{'temperature':0.1,'num_predict':1800},'messages':[{'role':'user','content':prompt}]}).encode('utf-8')
            req=urllib.request.Request('http://127.0.0.1:11434/api/chat',data=payload,headers={**headers,'Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(req,timeout=600) as response:
              model_result=json.loads(response.read().decode('utf-8'))
            raw=(model_result.get('message') or {}).get('content','')
            if not raw.strip():
              raise ValueError('Ollama native API returned empty message content')
            parsed=extract_json(raw)
            candidate=parsed.get('scenes',[]) if isinstance(parsed,dict) else []
            if len(candidate)==6 and all(isinstance(x,dict) and isinstance(x.get('voiceover'),str) and x['voiceover'].strip() and isinstance(x.get('visual_query'),str) and x['visual_query'].strip() for x in candidate):
              scenes=[{'voiceover':x['voiceover'].strip(),'visual_query':x['visual_query'].strip()} for x in candidate]
              print('Ollama generated six validated scenes.')
            else:
              print('Model JSON schema invalid; using validated fallback. Scene count:',len(candidate))
          except Exception as e:
            print('Inference failed; using fallback:',type(e).__name__,str(e)[:300])
          script='\n\n'.join(x['voiceover'] for x in scenes)
          Path('output/narrative_script.txt').write_text(script,encoding='utf-8')
          Path('output/scenes.json').write_text(json.dumps(scenes,indent=2,ensure_ascii=False),encoding='utf-8')
          print('Narrative ready:',len(scenes),'scenes')

          api_key=os.environ.get('PIXABAY_API_KEY','').strip()
          if not api_key:
            raise SystemExit('PIXABAY_API_KEY secret is missing. Add it in GitHub repository Settings > Secrets and variables > Actions.')
          seen_urls=set()
          valid=[]
          def pixabay_search(query, retries=5):
            params={'key':api_key,'q':query,'image_type':'photo','orientation':'vertical' if os.environ.get('ASPECT')!='landscape' else 'horizontal','safesearch':'true','per_page':30,'order':'relevance'}
            url='https://pixabay.com/api/?'+urllib.parse.urlencode(params)
            for attempt in range(retries):
              try:
                # Never print the request URL because it contains the API key.
                with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=45) as response:
                  payload=json.loads(response.read().decode('utf-8'))
                if 'hits' not in payload:
                  raise RuntimeError('Pixabay response did not contain hits')
                return payload['hits']
              except urllib.error.HTTPError as e:
                if e.code in (429,500,502,503,504):
                  retry=e.headers.get('Retry-After','')
                  try: delay=min(90,max(5,int(retry))) if retry else min(60,5*(2**attempt))
                  except ValueError: delay=min(60,5*(2**attempt))
                  print(f'Pixabay HTTP {e.code}; retry {attempt+1}/{retries} after {delay}s')
                  if attempt==retries-1: raise
                  time.sleep(delay)
                else:
                  raise RuntimeError(f'Pixabay API returned HTTP {e.code}; check PIXABAY_API_KEY and API access')
              except Exception as e:
                print(f'Pixabay request retry {attempt+1}/{retries}: {type(e).__name__}: {e}')
                if attempt==retries-1: raise
                time.sleep(min(45,4*(2**attempt)))
            return []
          def clean_query(value):
            value=re.sub(r'[^A-Za-z0-9 ,\-]', ' ', value)
            value=re.sub(r'\s+',' ',value).strip()
            words=value.split()
            return ' '.join(words[:12])
          for idx,scene in enumerate(scenes,1):
            base=clean_query(scene['visual_query'])
            topic_clean=clean_query(topic)
            scene_terms=[
              ['Petra Jordan aerial view Nabataean city sandstone','Petra archaeological park landscape Jordan'],
              ['Petra Siq gorge Al Khazneh rock cut tomb','Petra Treasury facade sandstone gorge'],
              ['Nabataean Petra caravan trade incense silk spice','Petra ancient trade route caravan relief'],
              ['Petra Nabataean water channels cisterns dams','Petra ancient water engineering aqueduct reservoir'],
              ['Petra colonnaded street Roman theatre Byzantine church','Petra archaeological Roman Byzantine ruins'],
              ['Petra Ad Deir Monastery Royal Tombs conservation','Petra sandstone monuments archaeological preservation']
            ][idx-1]
            queries=[base,clean_query(topic_clean+' '+scene_terms[0]),clean_query(scene_terms[1])]
            hits=[]
            for query in queries:
              if not query: continue
              try:
                print(f'PIXABAY SCENE {idx} SEARCH:',query)
                results=pixabay_search(query)
                print(f'PIXABAY SCENE {idx} RESULTS:',len(results))
                for hit in results:
                  image_url=hit.get('largeImageURL') or hit.get('webformatURL')
                  if not image_url or image_url in seen_urls: continue
                  if hit.get('type') not in ('photo','illustration','vector'): continue
                  seen_urls.add(image_url)
                  hits.append({'url':image_url,'title':hit.get('tags',''),'page':hit.get('pageURL',''),'user':hit.get('user',''),'scene':idx,'provider':'Pixabay','query':query,'license':'Pixabay Content License'})
                if len(hits)>=2: break
              except Exception as e:
                print(f'Pixabay scene {idx} query failed: {type(e).__name__}: {str(e)[:200]}')
              time.sleep(2)
            got=0
            for hit in hits:
              try:
                raw=fetch(hit['url'],tries=4)
                if len(raw)<1200: continue
                with tempfile.NamedTemporaryFile(suffix='.img',delete=False) as tmp:
                  tmp.write(raw); source=tmp.name
                dest=Path(f'commons_assets/scene{idx:02}_image{got+1}.jpg')
                conv=subprocess.run(['ffmpeg','-y','-v','error','-i',source,'-frames:v','1','-q:v','2',str(dest)],capture_output=True,text=True)
                Path(source).unlink(missing_ok=True)
                if conv.returncode or not dest.exists() or dest.stat().st_size<1200:
                  dest.unlink(missing_ok=True)
                  print('Skipped invalid Pixabay image:',hit.get('title','')[:100])
                  continue
                hit['local']=str(dest)
                valid.append(hit);got+=1
                print('Validated Pixabay image:',hit.get('title','')[:140],'| contributor:',hit.get('user','unknown'))
                if got>=2: break
              except Exception as e:
                print('Pixabay asset skipped:',type(e).__name__,str(e)[:180])
              time.sleep(2)
            print(f'PIXABAY SCENE {idx} FINAL IMAGE COUNT:',got)
            time.sleep(3)
          counts={i:sum(1 for item in valid if item['scene']==i) for i in range(1,7)}
          missing=[i for i,count in counts.items() if count<1]
          print('Per-scene Pixabay image counts:',counts)
          if missing:
            raise SystemExit(f'Pixabay could not provide valid images for scenes: {missing}. Adjust visual queries or verify Pixabay API access.')
          Path('output/pixabay_sources.json').write_text(json.dumps(valid,indent=2,ensure_ascii=False))
          Path('output/research_facts.json').write_text(json.dumps({
            'topic':'The Lost City of Petra',
            'facts':petra_facts,
            'sources':['https://whc.unesco.org/en/list/326/','https://www.visitpetra.jo/en/Trail/1','https://www.unesco.org/en/articles/preserving-petras-nabatean-architectural-heritage'],
            'note':'Narrative evidence pack prepared from UNESCO World Heritage Centre and official Petra visitor information.'
          },indent=2,ensure_ascii=False),encoding='utf-8')
          Path('commons_assets/list.txt').write_text(','.join(c['local'] for c in valid))
          print('Total validated Pixabay image assets:',len(valid))
          PY
      - name: Render scene-locked clips and assemble timeline
        env:
          TOPIC: ${{ inputs.topic }}
          LANGUAGE: ${{ inputs.language }}
          ASPECT: ${{ inputs.aspect }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,shutil,os
          from pathlib import Path
          scenes=json.loads(Path('output/scenes.json').read_text())
          if len(scenes)!=6: raise SystemExit(f'Expected 6 scenes, got {len(scenes)}')
          clips_dir=Path('output/scene_clips')
          if clips_dir.exists(): shutil.rmtree(clips_dir)
          clips_dir.mkdir(parents=True)
          task_root=Path('storage/tasks')
          for i,scene in enumerate(scenes,1):
            assets=sorted(Path('commons_assets').glob(f'scene{i:02}_image*.jpg'))
            if not assets: raise SystemExit(f'No scene-specific images for scene {i}')
            script=scene['voiceover'].strip()
            materials=','.join(str(p.resolve()) for p in assets)
            cmd=['python','cli.py','--video-subject',os.environ['TOPIC'],'--video-script',script,'--video-language',os.environ['LANGUAGE'],'--voice-name','en-US-AriaNeural','--voice-rate','1.04','--video-source','local','--video-materials',materials,'--video-aspect','16:9' if os.environ['ASPECT']=='landscape' else '9:16','--image-motion','zoom','--bgm-type','none','--subtitle-enabled','--stop-at','video']
            print(f'RENDERING LOCKED SCENE {i}/6 with {len(assets)} assigned images')
            subprocess.run(cmd,check=True)
            files=list(task_root.rglob('*.mp4'))
            if not files: raise SystemExit(f'No MP4 generated for scene {i}')
            latest=max(files,key=lambda p:p.stat().st_mtime)
            dest=clips_dir/f'scene{i:02}.mp4'
            shutil.copy2(latest,dest)
            print('Saved',dest)
          PY
          if [ "$ASPECT" = "landscape" ]; then W=1920; H=1080; else W=1080; H=1920; fi
          mkdir -p output/normalized
          for i in 1 2 3 4 5 6; do
            N=$(printf '%02d' "$i")
            ffmpeg -y -v error -i "output/scene_clips/scene${N}.mp4" -vf "scale=${W}:${H}:force_original_aspect_ratio=decrease,pad=${W}:${H}:(ow-iw)/2:(oh-ih)/2,fps=30,setsar=1" -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -c:a aac -b:a 192k -ar 44100 -ac 2 -movflags +faststart "output/normalized/scene${N}.mp4"
          done
          printf "file '%s'\\n" normalized/scene01.mp4 normalized/scene02.mp4 normalized/scene03.mp4 normalized/scene04.mp4 normalized/scene05.mp4 normalized/scene06.mp4 > output/concat.txt
          ffmpeg -y -v error -f concat -safe 0 -i output/concat.txt -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -c:a aac -b:a 192k -ar 44100 -ac 2 -movflags +faststart output/final.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 output/final.mp4
      - name: Validate final video
        run: |
          set -euo pipefail
          test -s output/final.mp4
          ffprobe -v error -of json -show_streams -show_format output/final.mp4 > output/probe.json
          python - <<'PY'
          import json
          d=json.load(open('output/probe.json'))
          streams=d.get('streams',[])
          if not any(s.get('codec_type')=='video' for s in streams):raise SystemExit('Output has no video stream')
          if not any(s.get('codec_type')=='audio' for s in streams):raise SystemExit('Output has no audio stream')
          print('Video and audio stream validation passed.')
          PY
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyPrinterTurbo-Ollama-video
          path: output/
          retention-days: 7
