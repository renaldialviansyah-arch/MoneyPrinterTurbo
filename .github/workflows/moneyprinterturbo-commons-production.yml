name: MoneyPrinterTurbo Ollama Production
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic"
        required: true
        default: "The mysterious history of forgotten cities"
      language:
        description: "Video script language"
        required: true
        default: "en-US"
      aspect:
        description: "Orientation"
        type: choice
        options: [portrait, landscape]
        default: portrait
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: android-mobile-work
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          python -m pip install --upgrade pip uv
          uv pip install --system --overrides requirements-security.txt -r requirements.txt
      - name: Install and start Ollama
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/version >/dev/null || { cat /tmp/ollama.log; exit 1; }
      - name: Pull local model
        run: |
          set -euo pipefail
          ollama pull qwen3:4b
          ollama list
      - name: Configure Ollama provider and preflight inference
        run: |
          set -euo pipefail
          cp config.example.toml config.toml
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path("config.toml")
          text=p.read_text()
          updates={
            "llm_provider": 'llm_provider = "ollama"',
            "ollama_base_url": 'ollama_base_url = "http://127.0.0.1:11434/v1"',
            "ollama_model_name": 'ollama_model_name = "qwen3:4b"',
          }
          for key,value in updates.items():
            pattern=rf"(?m)^{key}\s*=.*$"
            if not re.search(pattern,text):
              raise SystemExit(f"Config key not found: {key}")
            text=re.sub(pattern,value,text,count=1)
          p.write_text(text)
          print("Ollama config verified; provider and model set.")
          PY
          python - <<'PY'
          from openai import OpenAI
          client=OpenAI(base_url="http://127.0.0.1:11434/v1", api_key="ollama", timeout=180, max_retries=0)
          result=client.chat.completions.create(model="qwen3:4b",messages=[{"role":"user","content":"Reply with exactly the word READY."}],temperature=0)
          content=result.choices[0].message.content if result.choices else ""
          if not content or not content.strip(): raise SystemExit("SDK preflight returned empty output")
          print("OpenAI SDK preflight passed; response:",content.strip()[:120])
          PY
          # Confirm the CLI configuration actually contains the same provider/base URL/model.
          python - <<'PY'
          import tomllib
          from pathlib import Path
          c=tomllib.loads(Path("config.toml").read_text())
          # MoneyPrinterTurbo stores runtime settings under the [app] section.
          app=c.get("app", c)
          expected={"llm_provider":"ollama","ollama_base_url":"http://127.0.0.1:11434/v1","ollama_model_name":"qwen3:4b"}
          for k,v in expected.items():
            if app.get(k)!=v: raise SystemExit(f"CLI config mismatch for {k}: {app.get(k)!r}")
          print("CLI config audit passed: provider, URL, and model match the SDK preflight.")
          PY
      - name: Preflight through MoneyPrinterTurbo LLM service
        run: |
          set -euo pipefail
          python - <<'PY'
          from app.services.llm import _generate_response
          from app.config import config
          cfg=config.app
          print("Provider:",cfg.get("llm_provider"))
          print("Configured Ollama model:",cfg.get("ollama_model_name"))
          print("Configured Ollama URL:",cfg.get("ollama_base_url"))
          result=_generate_response("Reply with exactly PREFLIGHT_OK",request_timeout=120,max_retries=0)
          if not result or "PREFLIGHT_OK" not in result:
            raise SystemExit("MoneyPrinterTurbo LLM service preflight failed: unexpected response")
          print("MoneyPrinterTurbo service-level LLM preflight passed.")
          PY
      - name: Generate narrative and scene-specific Commons assets
        env:
          TOPIC: ${{ inputs.topic }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail
          mkdir -p commons_assets output
          python - <<'PY'
          import urllib.request,urllib.parse,json,re,subprocess,os,time
          from pathlib import Path
          from openai import OpenAI
          topic=os.environ['TOPIC']; language=os.environ['LANGUAGE']
          headers={'User-Agent':'MoneyPrinterTurboCommonsWorkflow/7.1'}
          def fetch(url,tries=4):
            for attempt in range(tries):
              try:return urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30).read()
              except Exception as e:
                print('retry',attempt+1,e)
                if attempt==tries-1:raise
                time.sleep(4*(attempt+1))
          # Validated fallback narration, used if local inference is unavailable or malformed.
          fallback=[
            {'voiceover':f"Imagine looking at {topic} from a different angle. The familiar story may leave out some important details.",'visual_query':topic+' location landscape'},
            {'voiceover':"First, look at the place where this story unfolded. Its geography helps explain what happened next.",'visual_query':topic+' historical location map'},
            {'voiceover':"The people who lived here left traces in objects, buildings, and the landscape itself.",'visual_query':topic+' archaeological artifacts architecture'},
            {'voiceover':"Those traces help us reconstruct daily life, although some parts of the story remain uncertain.",'visual_query':topic+' historical people daily life'},
            {'voiceover':"Later changes reshaped the place. Evidence of those changes can still be found in what survived.",'visual_query':topic+' ruins excavation site'},
            {'voiceover':"Today, these surviving traces are a reminder to distinguish what the evidence shows from what later stories claim.",'visual_query':topic+' modern site remains'}
          ]
          scenes=fallback
          try:
            client=OpenAI(base_url='http://127.0.0.1:11434/v1',api_key='ollama',timeout=600,max_retries=0)
            prompt=f"""Create a compact six-scene documentary short about: {topic}
          Language: {language}
          Return ONLY valid JSON with key scenes and exactly 6 objects, each containing voiceover and visual_query.
          Keep voiceover natural spoken language, concrete and concise, 1-2 sentences per scene, target 100-140 words total.
          Avoid generic filler, repeated rhetorical questions, invented facts, and unsupported dates/quotes/statistics.
          Visual queries: precise English image search phrases for each scene's actual subject; use locations, people, objects, architecture, maps, or evidence; avoid generic books/manuscripts.
          Sequence: hook, context, people/evidence, development, consequence, reveal."""
            response=client.chat.completions.create(model='qwen3:4b',messages=[{'role':'user','content':prompt}],temperature=0.25,max_tokens=1000)
            raw=response.choices[0].message.content or ''
            raw=re.sub(r'(?s)^.*?\{','{',raw,1);raw=re.sub(r'\}.*?$','}',raw,1)
            parsed=json.loads(raw);candidate=parsed.get('scenes',[])
            if len(candidate)==6 and all(isinstance(x,dict) and x.get('voiceover') and x.get('visual_query') for x in candidate):
              scenes=candidate;print('Ollama generated validated scene JSON.')
            else:print('Malformed response; using fallback.')
          except Exception as e:
            print('Inference failed; using fallback:',type(e).__name__,str(e)[:250])
          script='\n\n'.join(x['voiceover'].strip() for x in scenes)
          Path('output/narrative_script.txt').write_text(script,encoding='utf-8')
          Path('output/scenes.json').write_text(json.dumps(scenes,indent=2,ensure_ascii=False),encoding='utf-8')
          print('Narrative ready:',len(scenes),'scenes')
          seen_titles=set();seen_urls=set();valid=[]
          for idx,scene in enumerate(scenes,1):
            query=scene['visual_query'].strip();print(f'SCENE {idx} QUERY:',query)
            params={'action':'query','list':'search','srsearch':query,'srnamespace':6,'srlimit':15,'format':'json'}
            try:
              search=json.loads(fetch('https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(params)))
              titles=[x['title'] for x in search.get('query',{}).get('search',[]) if x.get('title') not in seen_titles];seen_titles.update(titles)
              candidates=[]
              for offset in range(0,len(titles),10):
                batch=titles[offset:offset+10]
                if not batch:continue
                q={'action':'query','titles':'|'.join(batch),'prop':'imageinfo','iiprop':'url|extmetadata','iiurlwidth':960,'format':'json'}
                details=json.loads(fetch('https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(q)))
                for page in details.get('query',{}).get('pages',{}).values():
                  info=(page.get('imageinfo') or [{}])[0];meta=info.get('extmetadata',{});lic=meta.get('LicenseShortName',{}).get('value','')
                  if not lic or re.search(r'Non.?Commercial|No.?Derivatives|\bNC\b|\bND\b',lic,re.I):continue
                  url=info.get('thumburl') or info.get('url','')
                  if url and url not in seen_urls:seen_urls.add(url);candidates.append({'url':url,'title':page.get('title',''),'license':lic,'page':info.get('descriptionurl',''),'query':query,'scene':idx})
              got=0
              for c in candidates:
                try:
                  raw=fetch(c['url'],tries=3)
                  if len(raw)<1200:continue
                  p=Path(f'commons_assets/scene{idx:02}_image{got+1}.jpg');p.write_bytes(raw)
                  chk=subprocess.run(['ffmpeg','-v','error','-i',str(p),'-frames:v','1','-f','null','-'],capture_output=True)
                  if chk.returncode:p.unlink(missing_ok=True);continue
                  c['local']=str(p);valid.append(c);got+=1;print('Validated:',c['title'])
                  if got>=2:break
                except Exception as e:print('Asset skipped:',e)
              time.sleep(1)
            except Exception as e:print('Scene query failed:',e)
          if len(valid)<6:raise SystemExit(f'Only {len(valid)} valid scene assets; minimum 6 required.')
          Path('output/commons_sources.json').write_text(json.dumps(valid,indent=2,ensure_ascii=False))
          Path('commons_assets/list.txt').write_text(','.join(c['local'] for c in valid))
          print('Assets validated:',len(valid))
          PY
      - name: Generate video with MoneyPrinterTurbo
        env:
          TOPIC: ${{ inputs.topic }}
          LANGUAGE: ${{ inputs.language }}
          ASPECT: ${{ inputs.aspect }}
        run: |
          set -euo pipefail
          if [ "$ASPECT" = "landscape" ]; then RATIO="16:9"; else RATIO="9:16"; fi
          MATERIALS="$(cat commons_assets/list.txt)"
          SCRIPT="$(cat output/narrative_script.txt)"\n          python cli.py --video-subject "$TOPIC" --video-script "$SCRIPT" --video-language "$LANGUAGE" --voice-name en-US-AriaNeural --voice-rate 1.04 --video-source local --video-materials "$MATERIALS" --video-aspect "$RATIO" --image-motion zoom --subtitle-enabled --stop-at video
          python - <<'PY'
          from pathlib import Path
          import shutil
          files=list(Path('storage/tasks').rglob('*.mp4'))
          if not files: raise SystemExit('No MP4 output found')
          files.sort(key=lambda p:p.stat().st_mtime,reverse=True)
          shutil.copy2(files[0],Path('output/final.mp4'))
          print('Final MP4:',files[0])
          PY
      - name: Validate final video
        run: |
          set -euo pipefail
          test -s output/final.mp4
          ffprobe -v error -of json -show_streams -show_format output/final.mp4 > output/probe.json
          python - <<'PY'
          import json
          d=json.load(open('output/probe.json'))
          streams=d.get('streams',[])
          if not any(s.get('codec_type')=='video' for s in streams):raise SystemExit('Output has no video stream')
          if not any(s.get('codec_type')=='audio' for s in streams):raise SystemExit('Output has no audio stream')
          print('Video and audio stream validation passed.')
          PY
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyPrinterTurbo-Ollama-video
          path: output/
          retention-days: 7
