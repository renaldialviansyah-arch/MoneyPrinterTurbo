name: MoneyPrinterTurbo Commons Production
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic"
        required: true
        default: "The mysterious history of forgotten cities"
      language:
        description: "Video script language"
        required: true
        default: "en-US"
      aspect:
        description: "Orientation"
        type: choice
        options: [portrait, landscape]
        default: portrait
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and FFmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip uv
          uv pip install --system --overrides requirements-security.txt -r requirements.txt
      - name: Configure LLM (no stock API)
        env:
          MOONSHOT_KEY: ${{ secrets.MOONSHOT_API_KEY }}
        run: |
          if [ -z "$MOONSHOT_KEY" ]; then echo "Missing MOONSHOT_API_KEY repository secret"; exit 1; fi
          python - <<'PY'
          import os
          from pathlib import Path
          key=os.environ['MOONSHOT_KEY'].replace('"','\\\"')
          Path('config.toml').write_text(f'''log_level = "INFO"
          listen_host = "127.0.0.1"
          listen_port = 8080
          video_source = "local"
          llm_provider = "moonshot"
          moonshot_api_key = "{key}"
          moonshot_base_url = ""
          moonshot_model_name = ""
          ''')
          PY
      - name: Download Commons images with query fallback
        env:
          TOPIC: ${{ inputs.topic }}
        run: |
          mkdir -p commons_assets output
          python - <<'PY'
          import urllib.request,urllib.parse,json,re,subprocess,os,time
          from pathlib import Path
          topic=os.environ['TOPIC']
          headers={'User-Agent':'MoneyPrinterTurboCommonsWorkflow/3.0 (GitHub Actions video pipeline; contact via repository)'}
          def fetch(url,tries=4):
            for attempt in range(tries):
              try:return urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30).read()
              except Exception as e:
                print('retry',attempt+1,e)
                if attempt==tries-1:raise
                time.sleep(10*(attempt+1))
          queries=[topic, ' '.join(topic.split()[:3]), 'historical photographs']
          candidates=[];seen_titles=set()
          for query in queries:
            params={'action':'query','list':'search','srsearch':query,'srnamespace':6,'srlimit':30,'format':'json'}
            searchurl='https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(params)
            try:
              data=json.loads(fetch(searchurl))
              titles=[x['title'] for x in data.get('query',{}).get('search',[]) if x.get('title') not in seen_titles]
              seen_titles.update(titles)
              for offset in range(0,len(titles),10):
                batch=titles[offset:offset+10]
                if not batch:continue
                q={'action':'query','titles':'|'.join(batch),'prop':'imageinfo','iiprop':'url|extmetadata','iiurlwidth':640,'format':'json'}
                data=json.loads(fetch('https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(q)))
                for page in data.get('query',{}).get('pages',{}).values():
                  info=(page.get('imageinfo') or [{}])[0];meta=info.get('extmetadata',{})
                  lic=meta.get('LicenseShortName',{}).get('value','')
                  if not lic or re.search(r'Non.?Commercial|No.?Derivatives|\bNC\b|\bND\b',lic,re.I):continue
                  url=info.get('thumburl') or info.get('url','')
                  if url and url not in [c['url'] for c in candidates]:
                    candidates.append({'url':url,'title':page.get('title',''),'license':lic,'page':info.get('descriptionurl','')})
              time.sleep(4)
            except Exception as e:print('Search query failed',query,e)
            if len(candidates)>=15:break
          valid=[]
          for c in candidates:
            try:
              raw=fetch(c['url'],tries=3)
              if len(raw)<1200:continue
              p=Path(f'commons_assets/image{len(valid)+1:02}.jpg');p.write_bytes(raw)
              chk=subprocess.run(['ffmpeg','-v','error','-i',str(p),'-frames:v','1','-f','null','-'],capture_output=True)
              if chk.returncode:p.unlink(missing_ok=True);continue
              c['local']=str(p);valid.append(c);print('Validated',c['title'])
              if len(valid)>=6:break
              time.sleep(2)
            except Exception as e:print('Candidate skipped',e)
          if len(valid)<3:raise SystemExit(f'Only {len(valid)} usable Commons images found. Wikimedia search/download unavailable or filtered.')
          Path('output/commons_sources.json').write_text(json.dumps(valid,indent=2,ensure_ascii=False))
          Path('commons_assets/list.txt').write_text(','.join(c['local'] for c in valid))
          print('Downloaded',len(valid),'images')
          PY
      - name: Generate using upstream MoneyPrinterTurbo CLI
        env:
          TOPIC: ${{ inputs.topic }}
          LANGUAGE: ${{ inputs.language }}
          ASPECT: ${{ inputs.aspect }}
        run: |
          if [ "$ASPECT" = "landscape" ]; then RATIO="16:9"; else RATIO="9:16"; fi
          MATERIALS="$(cat commons_assets/list.txt)"
          python cli.py --video-subject "$TOPIC" --video-language "$LANGUAGE" --video-source local --video-materials "$MATERIALS" --video-aspect "$RATIO" --image-motion zoom --subtitle-enabled --stop-at video
          python - <<'PY'
          from pathlib import Path
          import shutil
          files=list(Path('storage/tasks').rglob('*.mp4'))
          if not files: raise SystemExit('No video output MP4 found')
          files.sort(key=lambda p:p.stat().st_mtime,reverse=True)
          shutil.copy2(files[0],Path('output/final.mp4'))
          print('Output:',files[0])
          PY
      - name: Validate video
        run: |
          test -s output/final.mp4
          ffprobe -v error -show_streams -show_format output/final.mp4 > output/probe.json
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyPrinterTurbo-Commons-video
          path: output/
          retention-days: 7
