name: MoneyPrinterTurbo Ollama Production
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic"
        required: true
        default: "The mysterious history of forgotten cities"
      language:
        description: "Video script language"
        required: true
        default: "en-US"
      aspect:
        description: "Orientation"
        type: choice
        options: [portrait, landscape]
        default: portrait
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: android-mobile-work
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          python -m pip install --upgrade pip uv
          uv pip install --system --overrides requirements-security.txt -r requirements.txt
      - name: Install and start Ollama
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/version >/dev/null || { cat /tmp/ollama.log; exit 1; }
      - name: Pull local model
        run: |
          set -euo pipefail
          ollama pull qwen3:4b
          ollama list
      - name: Configure Ollama provider and preflight inference
        run: |
          set -euo pipefail
          cp config.example.toml config.toml
          python - <<'PY'
          import re
          from pathlib import Path
          p=Path("config.toml")
          text=p.read_text()
          updates={
            "llm_provider": 'llm_provider = "ollama"',
            "ollama_base_url": 'ollama_base_url = "http://127.0.0.1:11434/v1"',
            "ollama_model_name": 'ollama_model_name = "qwen3:4b"',
          }
          for key,value in updates.items():
            pattern=rf"(?m)^{key}\s*=.*$"
            if not re.search(pattern,text):
              raise SystemExit(f"Config key not found: {key}")
            text=re.sub(pattern,value,text,count=1)
          p.write_text(text)
          print("Ollama config verified; provider and model set.")
          PY
          python - <<'PY'
          from openai import OpenAI
          client=OpenAI(base_url="http://127.0.0.1:11434/v1", api_key="ollama", timeout=180, max_retries=0)
          result=client.chat.completions.create(model="qwen3:4b",messages=[{"role":"user","content":"Reply with exactly the word READY."}],temperature=0)
          content=result.choices[0].message.content if result.choices else ""
          if not content or not content.strip(): raise SystemExit("SDK preflight returned empty output")
          print("OpenAI SDK preflight passed; response:",content.strip()[:120])
          PY
          # Confirm the CLI configuration actually contains the same provider/base URL/model.
          python - <<'PY'
          import tomllib
          from pathlib import Path
          c=tomllib.loads(Path("config.toml").read_text())
          # MoneyPrinterTurbo stores runtime settings under the [app] section.
          app=c.get("app", c)
          expected={"llm_provider":"ollama","ollama_base_url":"http://127.0.0.1:11434/v1","ollama_model_name":"qwen3:4b"}
          for k,v in expected.items():
            if app.get(k)!=v: raise SystemExit(f"CLI config mismatch for {k}: {app.get(k)!r}")
          print("CLI config audit passed: provider, URL, and model match the SDK preflight.")
          PY
      - name: Preflight through MoneyPrinterTurbo LLM service
        run: |
          set -euo pipefail
          python - <<'PY'
          from app.services.llm import _generate_response
          from app.config import config
          cfg=config.app
          print("Provider:",cfg.get("llm_provider"))
          print("Configured Ollama model:",cfg.get("ollama_model_name"))
          print("Configured Ollama URL:",cfg.get("ollama_base_url"))
          result=_generate_response("Reply with exactly PREFLIGHT_OK",request_timeout=120,max_retries=0)
          if not result or "PREFLIGHT_OK" not in result:
            raise SystemExit("MoneyPrinterTurbo LLM service preflight failed: unexpected response")
          print("MoneyPrinterTurbo service-level LLM preflight passed.")
          PY
      - name: Generate narrative and scene-specific Commons assets
        env:
          TOPIC: ${{ inputs.topic }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail
          mkdir -p commons_assets output
          python - <<'PY'
          import urllib.request, urllib.parse, urllib.error, json, re, subprocess, os, time, html, tempfile
          from pathlib import Path
          from openai import OpenAI

          topic=os.environ['TOPIC']
          language=os.environ['LANGUAGE']
          headers={'User-Agent':'MoneyPrinterTurboCommonsWorkflow/8.0 (documentary video asset retrieval)'}
          def fetch(url,tries=5):
            for attempt in range(tries):
              try:
                with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=45) as response:
                  return response.read()
              except urllib.error.HTTPError as e:
                if e.code==429 or 500<=e.code<600:
                  retry=e.headers.get('Retry-After','')
                  try: delay=min(90,max(5,int(retry))) if retry else min(60,5*(2**attempt))
                  except ValueError: delay=min(60,5*(2**attempt))
                  print(f'HTTP {e.code}; retry {attempt+1}/{tries} after {delay}s')
                  if attempt==tries-1: raise
                  time.sleep(delay)
                else:
                  raise
              except Exception as e:
                print(f'Network retry {attempt+1}/{tries}: {type(e).__name__}: {e}')
                if attempt==tries-1: raise
                time.sleep(min(45,4*(2**attempt)))
            raise RuntimeError('HTTP retries exhausted')

          fallback=[
            {'voiceover':f"Imagine looking at {topic} from a different angle. The familiar story may leave out some important details.",'visual_query':topic+' location landscape photograph'},
            {'voiceover':"First, look at the place where this story unfolded. Its geography helps explain what happened next.",'visual_query':topic+' historical location map photograph'},
            {'voiceover':"The people who lived here left traces in objects, buildings, and the landscape itself.",'visual_query':topic+' archaeological artifacts ancient architecture photograph'},
            {'voiceover':"Those traces help us reconstruct daily life, although some parts of the story remain uncertain.",'visual_query':topic+' historical people daily life reconstruction photograph'},
            {'voiceover':"Later changes reshaped the place. Evidence of those changes can still be found in what survived.",'visual_query':topic+' ruins excavation archaeological site photograph'},
            {'voiceover':"Today, these surviving traces are a reminder to distinguish what the evidence shows from what later stories claim.",'visual_query':topic+' modern archaeological site remains photograph'}
          ]

          def extract_json(raw):
            raw=(raw or '').strip()
            raw=re.sub(r'^\x60{3}(?:json)?\s*','',raw,flags=re.I)
            raw=re.sub(r'\s*\x60{3}$','',raw)
            first=raw.find('{')
            if first<0: raise ValueError('No JSON object found in model response')
            depth=0; quoted=False; escaped=False
            for pos,ch in enumerate(raw[first:],first):
              if quoted:
                if escaped: escaped=False
                elif ch=='\\': escaped=True
                elif ch=='"': quoted=False
              else:
                if ch=='"': quoted=True
                elif ch=='{': depth+=1
                elif ch=='}':
                  depth-=1
                  if depth==0: return json.loads(raw[first:pos+1])
            raise ValueError('JSON object is incomplete')

          scenes=fallback
          try:
            client=OpenAI(base_url='http://127.0.0.1:11434/v1',api_key='ollama',timeout=600,max_retries=0)
            prompt=f"""Return one valid JSON object only. No markdown fences or explanation.
          Required schema: {{"scenes":[{{"voiceover":"...","visual_query":"..."}}]}}
          Create exactly 6 scenes for this documentary topic: {topic}
          Script language: {language}
          Each voiceover should be natural spoken narration, concrete, 1-2 sentences. Total target 100-140 words.
          Avoid generic filler, repeated rhetorical questions, invented facts, and unsupported dates, quotes, or statistics.
          Each visual_query must be a specific English search phrase for a photograph or image of the actual subject in that scene.
          Sequence: hook, geographic context, people and evidence, daily life/development, ruins or consequence, surviving evidence/reveal.
          Do not return any keys other than scenes, voiceover, and visual_query."""
            response=client.chat.completions.create(model='qwen3:4b',messages=[{'role':'user','content':prompt}],temperature=0.1,max_tokens=1800)
            raw=response.choices[0].message.content or ''
            parsed=extract_json(raw)
            candidate=parsed.get('scenes',[]) if isinstance(parsed,dict) else []
            if len(candidate)==6 and all(isinstance(x,dict) and isinstance(x.get('voiceover'),str) and x['voiceover'].strip() and isinstance(x.get('visual_query'),str) and x['visual_query'].strip() for x in candidate):
              scenes=[{'voiceover':x['voiceover'].strip(),'visual_query':x['visual_query'].strip()} for x in candidate]
              print('Ollama generated six validated scenes.')
            else:
              print('Model JSON schema invalid; using validated fallback. Scene count:',len(candidate))
          except Exception as e:
            print('Inference failed; using fallback:',type(e).__name__,str(e)[:300])
          script='\n\n'.join(x['voiceover'] for x in scenes)
          Path('output/narrative_script.txt').write_text(script,encoding='utf-8')
          Path('output/scenes.json').write_text(json.dumps(scenes,indent=2,ensure_ascii=False),encoding='utf-8')
          print('Narrative ready:',len(scenes),'scenes')

          seen_urls=set()
          valid=[]
          mime_ext={ 'image/jpeg':'.jpg', 'image/png':'.png', 'image/webp':'.webp', 'image/tiff':'.tif', 'image/gif':'.gif' }
          def search_titles(query):
            params={'action':'query','list':'search','srsearch':query,'srnamespace':6,'srlimit':12,'format':'json'}
            data=json.loads(fetch('https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(params)))
            return [x['title'] for x in data.get('query',{}).get('search',[])]
          def get_candidates(titles,query,scene_no):
            found=[]
            for offset in range(0,len(titles),8):
              batch=titles[offset:offset+8]
              if not batch: continue
              q={'action':'query','titles':'|'.join(batch),'prop':'imageinfo','iiprop':'url|mime|extmetadata','iiurlwidth':1000,'format':'json'}
              details=json.loads(fetch('https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(q)))
              for page in details.get('query',{}).get('pages',{}).values():
                info=(page.get('imageinfo') or [{}])[0]
                mime=(info.get('mime') or '').lower()
                if not mime.startswith('image/'): continue
                meta=info.get('extmetadata',{})
                lic=html.unescape(meta.get('LicenseShortName',{}).get('value',''))
                if not lic or re.search(r'non.?commercial|no.?derivatives|\bNC\b|\bND\b',lic,re.I): continue
                url=info.get('thumburl') or info.get('url','')
                if not url or url in seen_urls: continue
                seen_urls.add(url)
                found.append({'url':url,'mime':mime,'title':page.get('title',''),'license':lic,'page':info.get('descriptionurl',''),'query':query,'scene':scene_no})
              time.sleep(2)
            return found

          for idx,scene in enumerate(scenes,1):
            base=scene['visual_query'].strip()
            topic_clean=topic.strip()
            queries=[
              base,
              base+' photo',
              topic_clean+' '+(['location aerial photograph','historical map photograph','archaeological artifacts museum','historical daily life people','ruins excavation site','present day site photograph'][idx-1])
            ]
            candidates=[]
            for query in queries:
              try:
                print(f'SCENE {idx} SEARCH:',query)
                titles=search_titles(query)
                print(f'SCENE {idx} search returned {len(titles)} file records')
                candidates.extend(get_candidates(titles,query,idx))
                if len(candidates)>=2: break
              except Exception as e:
                print(f'Scene {idx} query failed: {type(e).__name__}: {e}')
              time.sleep(4)
            got=0
            for c in candidates:
              try:
                raw=fetch(c['url'],tries=4)
                if len(raw)<1200: continue
                suffix=mime_ext.get(c['mime'],'.img')
                with tempfile.NamedTemporaryFile(suffix=suffix,delete=False) as tmp:
                  tmp.write(raw); source=tmp.name
                dest=Path(f'commons_assets/scene{idx:02}_image{got+1}.jpg')
                conv=subprocess.run(['ffmpeg','-y','-v','error','-i',source,'-frames:v','1','-q:v','2',str(dest)],capture_output=True,text=True)
                Path(source).unlink(missing_ok=True)
                if conv.returncode or not dest.exists() or dest.stat().st_size<1200:
                  dest.unlink(missing_ok=True)
                  print('Skipped non-decodable image:',c['title'])
                  continue
                c['local']=str(dest)
                valid.append(c);got+=1
                print('Validated image:',c['title'],'|',c['mime'],'|',c['license'])
                if got>=2: break
              except Exception as e:
                print('Asset skipped:',type(e).__name__,str(e)[:180])
              time.sleep(2)
            print(f'SCENE {idx} FINAL IMAGE COUNT:',got)
            time.sleep(5)

          counts={i:sum(1 for item in valid if item['scene']==i) for i in range(1,7)}
          missing=[i for i,count in counts.items() if count<1]
          print('Per-scene image counts:',counts)
          if missing:
            raise SystemExit(f'Missing valid image assets for scenes: {missing}. Search retries and alternate queries were exhausted.')
          Path('output/commons_sources.json').write_text(json.dumps(valid,indent=2,ensure_ascii=False))
          Path('commons_assets/list.txt').write_text(','.join(c['local'] for c in valid))
          print('Total validated image assets:',len(valid))
          PY
          PY
      - name: Render scene-locked clips and assemble timeline
        env:
          TOPIC: ${{ inputs.topic }}
          LANGUAGE: ${{ inputs.language }}
          ASPECT: ${{ inputs.aspect }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,subprocess,shutil,os
          from pathlib import Path
          scenes=json.loads(Path('output/scenes.json').read_text())
          if len(scenes)!=6: raise SystemExit(f'Expected 6 scenes, got {len(scenes)}')
          clips_dir=Path('output/scene_clips')
          if clips_dir.exists(): shutil.rmtree(clips_dir)
          clips_dir.mkdir(parents=True)
          task_root=Path('storage/tasks')
          for i,scene in enumerate(scenes,1):
            assets=sorted(Path('commons_assets').glob(f'scene{i:02}_image*.jpg'))
            if not assets: raise SystemExit(f'No scene-specific images for scene {i}')
            script=scene['voiceover'].strip()
            materials=','.join(str(p.resolve()) for p in assets)
            cmd=['python','cli.py','--video-subject',os.environ['TOPIC'],'--video-script',script,'--video-language',os.environ['LANGUAGE'],'--voice-name','en-US-AriaNeural','--voice-rate','1.04','--video-source','local','--video-materials',materials,'--video-aspect','16:9' if os.environ['ASPECT']=='landscape' else '9:16','--image-motion','zoom','--bgm-type','none','--subtitle-enabled','--stop-at','video']
            print(f'RENDERING LOCKED SCENE {i}/6 with {len(assets)} assigned images')
            subprocess.run(cmd,check=True)
            files=list(task_root.rglob('*.mp4'))
            if not files: raise SystemExit(f'No MP4 generated for scene {i}')
            latest=max(files,key=lambda p:p.stat().st_mtime)
            dest=clips_dir/f'scene{i:02}.mp4'
            shutil.copy2(latest,dest)
            print('Saved',dest)
          PY
          if [ "$ASPECT" = "landscape" ]; then W=1920; H=1080; else W=1080; H=1920; fi
          mkdir -p output/normalized
          for i in 1 2 3 4 5 6; do
            N=$(printf '%02d' "$i")
            ffmpeg -y -v error -i "output/scene_clips/scene${N}.mp4" -vf "scale=${W}:${H}:force_original_aspect_ratio=decrease,pad=${W}:${H}:(ow-iw)/2:(oh-ih)/2,fps=30,setsar=1" -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -c:a aac -b:a 192k -ar 44100 -ac 2 -movflags +faststart "output/normalized/scene${N}.mp4"
          done
          printf "file '%s'\n" output/normalized/scene01.mp4 output/normalized/scene02.mp4 output/normalized/scene03.mp4 output/normalized/scene04.mp4 output/normalized/scene05.mp4 output/normalized/scene06.mp4 > output/concat.txt
          ffmpeg -y -v error -f concat -safe 0 -i output/concat.txt -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -c:a aac -b:a 192k -ar 44100 -ac 2 -movflags +faststart output/final.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 output/final.mp4
      - name: Validate final video
        run: |
          set -euo pipefail
          test -s output/final.mp4
          ffprobe -v error -of json -show_streams -show_format output/final.mp4 > output/probe.json
          python - <<'PY'
          import json
          d=json.load(open('output/probe.json'))
          streams=d.get('streams',[])
          if not any(s.get('codec_type')=='video' for s in streams):raise SystemExit('Output has no video stream')
          if not any(s.get('codec_type')=='audio' for s in streams):raise SystemExit('Output has no audio stream')
          print('Video and audio stream validation passed.')
          PY
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoneyPrinterTurbo-Ollama-video
          path: output/
          retention-days: 7
