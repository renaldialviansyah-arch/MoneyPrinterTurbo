name: MoneyPrinterTurbo Native - Gemini + Pixabay

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video topic"
        required: true
        default: "The Lost City of Petra"
        type: string
      language:
        description: "Narration language"
        required: true
        default: "en-US"
        type: string
      aspect:
        description: "Video orientation"
        required: true
        type: choice
        options:
          - portrait
          - landscape
        default: portrait
      paragraphs:
        description: "Script paragraph count"
        required: true
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout MoneyPrinterTurbo native code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install native system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          sudo sed -i '/<policy domain="path" rights="none" pattern="@\*"/d' /etc/ImageMagick-6/policy.xml 2>/dev/null || true

      - name: Install MoneyPrinterTurbo requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Configure native MoneyPrinterTurbo providers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY" || { echo "Missing GitHub Secret: GEMINI_API_KEY"; exit 1; }
          test -n "$PIXABAY_API_KEY" || { echo "Missing GitHub Secret: PIXABAY_API_KEY"; exit 1; }
          cp config.example.toml config.toml
          python - <<'PY'
          import json, os, re
          from pathlib import Path

          path = Path("config.toml")
          text = path.read_text(encoding="utf-8")
          values = {
              "llm_provider": '"gemini"',
              "gemini_api_key": json.dumps(os.environ["GEMINI_API_KEY"]),
              "video_source": '"pixabay"',
              "pixabay_api_keys": "[" + json.dumps(os.environ["PIXABAY_API_KEY"]) + "]",
          }
          for key, value in values.items():
              pattern = rf"(?m)^{re.escape(key)}\s*=.*$"
              text, count = re.subn(pattern, f"{key} = {value}", text, count=1)
              if count != 1:
                  raise SystemExit(f"Could not set required native config key: {key}")
          path.write_text(text, encoding="utf-8")
          print("Native MoneyPrinterTurbo config ready: Gemini LLM + Pixabay materials.")
          PY

      - name: Generate video with native MoneyPrinterTurbo CLI
        env:
          TOPIC: ${{ inputs.topic }}
          LANGUAGE: ${{ inputs.language }}
          ASPECT: ${{ inputs.aspect }}
          PARAGRAPHS: ${{ inputs.paragraphs }}
        run: |
          set -euo pipefail
          mkdir -p output
          case "$ASPECT" in
            portrait) VIDEO_ASPECT="9:16" ;;
            landscape) VIDEO_ASPECT="16:9" ;;
            *) echo "Unsupported aspect: $ASPECT"; exit 1 ;;
          esac
          python cli.py \
            --video-subject "$TOPIC" \
            --video-language "$LANGUAGE" \
            --paragraph-number "$PARAGRAPHS" \
            --video-source pixabay \
            --video-aspect "$VIDEO_ASPECT" \
            --video-count 1 \
            --voice-name en-US-AriaNeural \
            --subtitle-enabled \
            > output/native-result.json
          python - <<'PY'
          import json, shutil
          from pathlib import Path

          result = json.loads(Path("output/native-result.json").read_text(encoding="utf-8"))
          videos = (result.get("result") or {}).get("videos") or result.get("videos") or []
          if not videos:
              raise SystemExit("Native MoneyPrinterTurbo CLI returned no video path.")
          source = Path(videos[0])
          if not source.is_file() or source.stat().st_size < 100_000:
              raise SystemExit(f"Native output is missing or unexpectedly small: {source}")
          destination = Path("output/final.mp4")
          shutil.copy2(source, destination)
          print(f"Native MoneyPrinterTurbo video ready: {destination} ({destination.stat().st_size} bytes)")
          print(f"Task result: {Path('output/native-result.json')}")
          PY

      - name: Upload native MoneyPrinterTurbo video
        uses: actions/upload-artifact@v4
        with:
          name: moneyprinterturbo-native-video
          path: |
            output/final.mp4
            output/native-result.json
          if-no-files-found: error
          retention-days: 7
