name: AI Video Production (Manual Trigger)
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Narration script (one or more paragraphs)"
        required: true
        type: string
      piper_model_url:
        description: "Direct URL to Piper .onnx voice model"
        required: true
        type: string
      piper_config_url:
        description: "Direct URL to Piper model .json config"
        required: true
        type: string
      output_name:
        description: "Output filename"
        required: true
        default: "final.mp4"
        type: string
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-mobile-work
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install piper-tts
      - name: Download voice model
        run: |
          mkdir -p production/voice production/work
          curl -fL "${{ inputs.piper_model_url }}" -o production/voice/model.onnx
          curl -fL "${{ inputs.piper_config_url }}" -o production/voice/model.onnx.json
          test -s production/voice/model.onnx
          test -s production/voice/model.onnx.json
      - name: Save script
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path("production/script.txt").write_text(os.environ["VIDEO_SCRIPT"], encoding="utf-8")
          PY
        env:
          VIDEO_SCRIPT: ${{ inputs.script }}
      - name: Produce video
        run: |
          python scripts/android_production_pipeline_v8.py \
            --script production/script.txt \
            --auto-visuals \
            --tts-engine piper \
            --model production/voice/model.onnx \
            --output "production/${{ inputs.output_name }}" \
            --work-dir production/work \
            --width 720 --height 1280 --fps 24 --motion subtle
      - name: Upload production files
        uses: actions/upload-artifact@v4
        with:
          name: AI-video-output
          path: |
            production/${{ inputs.output_name }}
            production/work/pipeline_report.json
            production/work/asset_sources.json
            production/work/qc.json
          if-no-files-found: error
          retention-days: 7
