name: AI Video Production (Manual Trigger)
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Narration script"
        required: true
        type: string
      output_name:
        description: "Output filename"
        required: true
        default: "final.mp4"
        type: string
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-mobile-work
      - name: Install tools and image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pil
          python -m pip install --upgrade pip
          python -m pip install piper-tts Pillow
          python - <<'PY'
          import sys
          from PIL import Image, ImageDraw, ImageFont
          print("Python:",sys.executable)
          print("Pillow:",Image.__version__)
          print("PIL import and image classes verified")
          PY
      - name: Download Indonesian Piper voice automatically
        run: |
          mkdir -p production/voice production/work
          MODEL_URL="https://huggingface.co/rhasspy/piper-voices/resolve/main/id/id_ID/news_tts/medium/id_ID-news_tts-medium.onnx"
          CONFIG_URL="${MODEL_URL}.json"
          curl --retry 3 --retry-delay 2 -fL "$MODEL_URL" -o production/voice/model.onnx
          curl --retry 3 --retry-delay 2 -fL "$CONFIG_URL" -o production/voice/model.onnx.json
          test -s production/voice/model.onnx
          test -s production/voice/model.onnx.json
      - name: Validate and save script
        env:
          VIDEO_SCRIPT: ${{ inputs.script }}
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          name=os.environ["OUTPUT_NAME"]
          if not re.fullmatch(r"[A-Za-z0-9._-]+\.mp4",name,re.I):
              raise SystemExit("Output must be a simple .mp4 filename")
          s=os.environ["VIDEO_SCRIPT"].strip()
          if not s: raise SystemExit("Script cannot be empty")
          Path("production/script.txt").write_text(s,encoding="utf-8")
          PY
      - name: Produce video
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          test -s production/script.txt
          test -s production/voice/model.onnx
          python scripts/android_production_pipeline_v8.py --script production/script.txt --auto-visuals --tts-engine piper --model production/voice/model.onnx --output "production/$OUTPUT_NAME" --work-dir production/work --width 720 --height 1280 --fps 24 --motion subtle
      - name: Upload production files
        uses: actions/upload-artifact@v4
        with:
          name: AI-video-output
          path: |
            production/${{ inputs.output_name }}
            production/work/pipeline_report.json
            production/work/asset_sources.json
            production/work/qc.json
          if-no-files-found: error
          retention-days: 7
