name: AI Video Production (Manual Trigger)
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Narration script (one or more paragraphs)"
        required: true
        type: string
      piper_model_url:
        description: "Direct URL to Piper .onnx voice model"
        required: true
        type: string
      piper_config_url:
        description: "Direct URL to Piper model .json config"
        required: true
        type: string
      output_name:
        description: "Output filename (MP4)"
        required: true
        default: "final.mp4"
        type: string
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-mobile-work
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install piper-tts
          python -m pip install --upgrade Pillow
          python -c 'from PIL import Image, ImageDraw, ImageFont; print("Pillow verified")'
      - name: Validate inputs and download voice model
        env:
          MODEL_URL: ${{ inputs.piper_model_url }}
          CONFIG_URL: ${{ inputs.piper_config_url }}
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          python - <<'PY'
          import os,re
          name=os.environ["OUTPUT_NAME"]
          if not re.fullmatch(r"[A-Za-z0-9._-]+\.mp4",name,re.I):
              raise SystemExit("output_name must be a simple .mp4 filename")
          for k in ("MODEL_URL","CONFIG_URL"):
              if not os.environ[k].startswith("https://"):
                  raise SystemExit(k+" must be HTTPS")
          PY
          mkdir -p production/voice production/work
          curl -fL "$MODEL_URL" -o production/voice/model.onnx
          curl -fL "$CONFIG_URL" -o production/voice/model.onnx.json
          test -s production/voice/model.onnx
          test -s production/voice/model.onnx.json
      - name: Save script
        env:
          VIDEO_SCRIPT: ${{ inputs.script }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          s=os.environ["VIDEO_SCRIPT"].strip()
          if not s: raise SystemExit("Script cannot be empty")
          Path("production/script.txt").write_text(s, encoding="utf-8")
          PY
      - name: Produce video
        env:
          OUTPUT_NAME: ${{ inputs.output_name }}
        run: |
          python scripts/android_production_pipeline_v8.py \
            --script production/script.txt \
            --auto-visuals \
            --tts-engine piper \
            --model production/voice/model.onnx \
            --output "production/$OUTPUT_NAME" \
            --work-dir production/work \
            --width 720 --height 1280 --fps 24 --motion subtle
      - name: Upload production files
        uses: actions/upload-artifact@v4
        with:
          name: AI-video-output
          path: |
            production/${{ inputs.output_name }}
            production/work/pipeline_report.json
            production/work/asset_sources.json
            production/work/qc.json
          if-no-files-found: error
          retention-days: 7
