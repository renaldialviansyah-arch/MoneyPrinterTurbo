name: Real Video Production Engine v2
on:
  workflow_dispatch:
    inputs:
      narration:
        description: "Narration"
        required: true
        default: "At night, the city becomes quiet. Rain reflects the lights on the streets. A researcher discovers a mysterious clue that changes everything."
      title:
        description: "Video title"
        required: true
        default: "The Mystery of the Rainy City"
jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-mobile-work
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak python3
      - name: Voice and acquire assets
        env:
          NARRATION: ${{ inputs.narration }}
          TITLE: ${{ inputs.title }}
        run: |
          mkdir -p output/assets output/report
          printf "%s\n" "$NARRATION" > output/narration.txt
          espeak -v en-us -s 145 -p 48 -w output/narration.wav "$NARRATION"
          python - <<'PY'
          import json,re,urllib.request,urllib.parse,subprocess
          from pathlib import Path
          text=Path('output/narration.txt').read_text().strip()
          chunks=[x.strip() for x in re.split(r'(?<=[.!?])\s+',text) if x.strip()]
          allowed=re.compile(r'(public domain|public-domain|cc0|creative commons.*(by|by-sa)|cc by|cc-by)',re.I)
          def api(q):
            params={'action':'query','generator':'search','gsrsearch':q,'gsrnamespace':6,'gsrlimit':20,'prop':'imageinfo','iiprop':'url|extmetadata','format':'json'}
            req=urllib.request.Request('https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(params),headers={'User-Agent':'RealVideoEngine/2.0 (video workflow)'})
            return json.loads(urllib.request.urlopen(req,timeout=30).read().decode()).get('query',{}).get('pages',{})
          scenes=[]; used=set()
          for i,chunk in enumerate(chunks,1):
            keywords=' '.join(chunk.split()[:6])
            queries=[keywords, ' '.join(chunk.split()[:3]), 'cinematic '+keywords.split()[0] if keywords else 'cinematic landscape']
            pool=[]
            for q in queries:
              try:
                for pg in api(q).values():
                  info=(pg.get('imageinfo') or [{}])[0]; meta=info.get('extmetadata') or {};lic=meta.get('LicenseShortName',{}).get('value','')
                  url=info.get('url','')
                  if not allowed.search(lic) or not url or url in used:continue
                  if not re.search(r'\.(jpe?g|png|webp)(?:$|\?)',url,re.I):continue
                  pool.append({'url':url,'page':info.get('descriptionurl',''),'lic':lic,'title':pg.get('title',''),'artist':meta.get('Artist',{}).get('value','')})
              except Exception as e: print('Search query failed:',q,str(e))
            saved=None
            for c in pool[:15]:
              try:
                raw=urllib.request.urlopen(urllib.request.Request(c['url'],headers={'User-Agent':'RealVideoEngine/2.0'}),timeout=35).read()
                if len(raw)<1200:continue
                ext='.png' if '.png' in c['url'].lower() else '.webp' if '.webp' in c['url'].lower() else '.jpg'
                dst=Path(f'output/assets/scene{i:02}{ext}');dst.write_bytes(raw)
                check=subprocess.run(['ffmpeg','-v','error','-i',str(dst),'-frames:v','1','-f','null','-'],capture_output=True)
                if check.returncode:dst.unlink(missing_ok=True);continue
                c.update(local=str(dst),bytes=len(raw));saved=c;used.add(c['url']);break
              except Exception as e:print('Candidate rejected:',str(e))
            if not saved:raise SystemExit(f'No licensed, valid image found for scene {i}. Queries: {queries}')
            scenes.append({'scene':i,'text':chunk,'asset':saved})
          Path('output/report/assets.json').write_text(json.dumps(scenes,indent=2,ensure_ascii=False))
          PY
      - name: Render scene clips and subtitles
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          scenes=json.loads(Path('output/report/assets.json').read_text())
          audio='output/narration.wav'
          duration=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',audio]))
          per=duration/len(scenes)
          srt=[]
          def stamp(x):
            ms=int(x*1000);h,ms=divmod(ms,3600000);m,ms=divmod(ms,60000);s,ms=divmod(ms,1000);return f'{h:02}:{m:02}:{s:02},{ms:03}'
          for i,scene in enumerate(scenes):
            start=i*per;end=(i+1)*per
            srt.append(f'{i+1}\n{stamp(start)} --> {stamp(end)}\n{scene["text"]}\n')
            clip=f'output/clip{i+1:02}.mp4'
            cmd=['ffmpeg','-y','-loop','1','-i',scene['asset']['local'],'-t',str(per),'-vf','scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,zoompan=z=min(zoom+0.0005,1.07):x=iw/2-iw/zoom/2:y=ih/2-ih/zoom/2:d=1:s=720x1280:fps=24','-an','-c:v','libx264','-preset','ultrafast','-pix_fmt','yuv420p',clip]
            subprocess.run(cmd,check=True)
          Path('output/subtitles.srt').write_text('\n'.join(srt))
          Path('output/concat.txt').write_text('\n'.join("file '"+str(Path(f'output/clip{i+1:02}.mp4').resolve())+"'" for i in range(len(scenes)))+'\n')
          subprocess.run(['ffmpeg','-y','-f','concat','-safe','0','-i','output/concat.txt','-c','copy','output/video.mp4'],check=True)
          subprocess.run(['ffmpeg','-y','-i','output/video.mp4','-i',audio,'-i','output/subtitles.srt','-map','0:v','-map','1:a','-map','2:s','-c:v','copy','-c:a','aac','-c:s','mov_text','-shortest','-movflags','+faststart','output/final.mp4'],check=True)
          PY
      - name: Verify and upload
        run: ffprobe -v error -show_streams -show_format output/final.mp4 > output/report/probe.json && test -s output/final.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: real-video-production-v2
          path: output/
          retention-days: 7
