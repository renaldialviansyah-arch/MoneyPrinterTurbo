name: Android Production Test Engine Level 2
on:
  workflow_dispatch:
    inputs:
      test_script:
        description: "Short test narration (2-3 sentences)"
        required: false
        default: "A quiet city street glows beneath the rain at night. Reflections shimmer across the pavement as a lone researcher discovers a mysterious clue."
jobs:
  visual-production-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production code
        uses: actions/checkout@v4
        with:
          ref: android-mobile-work
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak
      - name: Prepare files
        run: mkdir -p level2-report production/work/visuals
      - name: Create script and plan
        env:
          TEST_SCRIPT: ${{ inputs.test_script }}
        run: |
          printf "%s\n" "$TEST_SCRIPT" > level2-report/script.txt
          python scripts/android_scene_planner_v2.py level2-report/script.txt --out production/work/plan.json
      - name: Generate test narration
        run: |
          python scripts/android_tts_espeak.py --text level2-report/script.txt --output production/work/narration.wav --voice en-us --speed 145
      - name: Align scenes and generate subtitles
        run: |
          python scripts/android_plan_audio_sync.py --plan production/work/plan.json --audio production/work/narration.wav --out production/work/plan_aligned.json
          python scripts/android_subtitle_generator.py --plan production/work/plan_aligned.json --out production/work/subtitles.srt
      - name: Acquire Wikimedia visuals (allow partial)
        continue-on-error: true
        run: |
          python scripts/android_commons_auto_assets.py --plan production/work/plan_aligned.json --out-dir production/work/visuals --manifest production/work/assets_local.json --report level2-report/asset_sources.json --max-attempts 5
      - name: Fill missing scenes with labelled fallback visuals
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          plan=json.load(open('production/work/plan_aligned.json'))
          mp=Path('production/work/assets_local.json')
          manifest=json.load(open(mp)) if mp.exists() else {'assets':[]}
          assets=manifest.get('assets',[])
          present={int(x['scene']) for x in assets}
          fallback=[]
          for i,scene in enumerate(plan['scenes'],1):
            if i in present: continue
            p=Path('production/work/visuals')/f'fallback_scene{i:03}.png'
            subprocess.run(['ffmpeg','-y','-f','lavfi','-i','color=c=0x202b38:s=360x640:d=1','-frames:v','1',str(p)],check=True,capture_output=True)
            assets.append({'scene':i,'path':str(p.resolve()),'source':'Generated fallback slate','license':'Original generated test asset','notes':'Commons asset unavailable; fallback slate used.'})
            fallback.append(i)
          manifest['assets']=assets
          mp.write_text(json.dumps(manifest,indent=2))
          Path('level2-report/fallback_scenes.json').write_text(json.dumps(fallback,indent=2))
          PY
      - name: Resolve assets
        run: |
          python scripts/android_visual_asset_engine.py --plan production/work/plan_aligned.json --manifest production/work/assets_local.json --assets-out production/work/assets_resolved.json --metadata-out level2-report/assets_metadata.json
      - name: Render video with acquired visuals
        run: |
          python scripts/android_multiscene_render_v5.py --plan production/work/plan_aligned.json --assets production/work/assets_resolved.json --audio production/work/narration.wav --subtitle production/work/subtitles.srt --output level2-report/level2_test.mp4 --work-dir production/work/render --width 360 --height 640 --fps 12 --motion subtle
      - name: Quality check
        run: |
          python scripts/android_video_qc.py level2-report/level2_test.mp4 --require-subtitles --min-width 360 --min-height 640 --report level2-report/qc.json
      - name: Write report
        if: always()
        run: |
          {
            echo "# Level 2 Visual Production Test"
            echo "- Wikimedia asset acquisition: see asset_sources.json"
            echo "- Missing assets fallback: see fallback_scenes.json"
            echo "- eSpeak narration: test voice, not Piper"
            echo "- Render/QC: see qc.json if present"
            echo "- Full production pipeline with Piper: NOT TESTED"
          } > level2-report/README.md
      - name: Upload Level 2 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-production-level2-results
          path: level2-report/
          retention-days: 7
