name: Android Production Test Engine
on:
  workflow_dispatch:
    inputs:
      test_script:
        description: "Optional narration text for planner test"
        required: false
        default: "Pada malam hari, kota menjadi sunyi. Cahaya lampu memantul di jalan basah. Seorang peneliti menemukan bukti baru."
jobs:
  production-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production code
        uses: actions/checkout@v4
        with:
          ref: android-mobile-work
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Prepare test report
        run: mkdir -p test-engine-report
      - name: Scene planner validation
        env:
          TEST_SCRIPT: ${{ inputs.test_script }}
        run: |
          printf "%s\n" "$TEST_SCRIPT" > test-engine-report/test_script.txt
          python scripts/android_scene_planner_v2.py test-engine-report/test_script.txt --out test-engine-report/scene_plan.json
          python - <<'PY'
          import json
          p=json.load(open("test-engine-report/scene_plan.json",encoding="utf-8"))
          assert p["scene_count"] >= 1
          assert all(s.get("narration") and s.get("search_terms") and s.get("visual_prompt") for s in p["scenes"])
          print("PLANNER PASS:",p["scene_count"],"scenes")
          PY
      - name: Synthetic render and QC
        run: |
          python scripts/android_render_smoke_test.py
          echo "Synthetic FFmpeg render, audio/video stream, subtitle and QC test passed." > test-engine-report/smoke_status.txt
      - name: Generate test summary
        if: always()
        run: |
          {
            echo "# Android Production Test Engine"
            echo
            echo "- Planner validation: completed"
            echo "- Synthetic render/QC: see step status"
            echo "- Piper neural voice: NOT TESTED"
            echo "- Wikimedia visual acquisition: NOT TESTED"
            echo "- Full production pipeline: NOT TESTED"
            echo
            echo "This run tests planning and synthetic rendering only."
          } > test-engine-report/README.md
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-production-test-report
          path: test-engine-report/
          retention-days: 7
