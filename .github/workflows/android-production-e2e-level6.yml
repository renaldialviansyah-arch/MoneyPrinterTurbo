name: Android Production Real End-to-End Level 6
on:
  workflow_dispatch:
  push:
    branches: [android-mobile-work]
    paths:
      - '.github/workflows/android-production-e2e-level6.yml'
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
        with:
          ref: android-mobile-work
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install Pillow numpy
          python -c "from PIL import Image,ImageDraw,ImageFont; import numpy; print('Pillow and NumPy OK')"
          ffmpeg -version
          ffprobe -version
          espeak-ng --version
      - name: Prepare short English production script
        run: |
          set -euo pipefail
          mkdir -p production/e2e-level6
          cat > production/e2e-level6/narration.txt <<'EOF'
          Across history, bridges have connected people, trade, and ideas. Forests protect countless species and help regulate our climate. High mountains reveal the powerful forces that shape our planet.
          EOF
      - name: Run full pipeline with sourced visual acquisition
        run: |
          set -euo pipefail
          python scripts/android_production_pipeline_v8.py \
            --script production/e2e-level6/narration.txt \
            --auto-visuals \
            --tts-engine espeak \
            --output production/e2e-level6/final.mp4 \
            --work-dir production/e2e-level6/work \
            --width 540 --height 960 --fps 24 --motion subtle
      - name: Independently verify video, streams, and asset status
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,pathlib,subprocess
          root=pathlib.Path('production/e2e-level6')
          video=root/'final.mp4'
          assert video.exists() and video.stat().st_size>15000, 'MP4 missing or suspiciously small'
          q=json.loads((root/'work/qc.json').read_text(encoding='utf-8'))
          assert q['status']=='PASS', q
          assert q['video_streams']>=1 and q['audio_streams']>=1 and q['subtitle_streams']>=1, q
          assert q['resolution']=='540x960', q
          m=json.loads((root/'work/assets_local.json').read_text(encoding='utf-8'))
          entries=m.get('assets',[])
          assert entries and len(entries)>=2, 'Insufficient scene assets'
          for item in entries:
              p=pathlib.Path(item['path'])
              assert p.exists() and p.stat().st_size>1200, f'Missing or tiny asset {p}'
          external=sum(1 for x in entries if str(x.get('source','')).startswith('http'))
          report={'status':'PASS','asset_status':'PASS' if external==len(entries) else 'DEGRADED','note':'Technical MP4 pass is separate from Wikimedia source verification; fallback graphics may be present.','video_bytes':video.stat().st_size,'resolution':q['resolution'],'duration_seconds':q['duration_seconds'],'video_streams':q['video_streams'],'audio_streams':q['audio_streams'],'subtitle_streams':q['subtitle_streams'],'source_asset_count':len(entries),'verified_external_sources':external,'sources':[{'scene':x.get('scene'),'title':x.get('title'),'source':x.get('source'),'license':x.get('license')} for x in entries]}
          (root/'e2e_validation.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(json.dumps(report,indent=2))
          PY
      - name: Upload complete end-to-end test bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-e2e-level6
          path: production/e2e-level6/
          retention-days: 7
