name: Real Video Production Engine
on:
  workflow_dispatch:
    inputs:
      narration:
        description: "Narration for the video"
        required: true
        default: "At night, the city becomes quiet. Rain reflects the lights on the streets. A researcher discovers a mysterious clue that changes everything."
      output_title:
        description: "Video title"
        required: true
        default: "The Mystery of the Rainy City"
jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: android-mobile-work
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak python3
      - name: Create production assets and narration
        env:
          NARRATION: ${{ inputs.narration }}
          TITLE: ${{ inputs.output_title }}
        run: |
          mkdir -p output/assets output/report
          printf "%s\n" "$NARRATION" > output/narration.txt
          espeak -v en-us -s 145 -p 48 -w output/narration.wav "$NARRATION"
          python - <<'PY'
          import os,json,urllib.request,urllib.parse,re
          from pathlib import Path
          text=Path('output/narration.txt').read_text().strip()
          chunks=[x.strip() for x in re.split(r'(?<=[.!?])\s+',text) if x.strip()]
          if not chunks: chunks=[text]
          scenes=[]
          for i,chunk in enumerate(chunks,1):
            terms=' '.join(chunk.split()[:8])
            params={'action':'query','generator':'search','gsrsearch':terms+' filetype:bitmap','gsrnamespace':6,'gsrlimit':15,'prop':'imageinfo','iiprop':'url|extmetadata','format':'json'}
            req=urllib.request.Request('https://commons.wikimedia.org/w/api.php?'+urllib.parse.urlencode(params),headers={'User-Agent':'RealVideoEngine/1.0 (GitHub Actions test)'})
            pages=urllib.request.urlopen(req,timeout=25).read().decode()
            data=json.loads(pages).get('query',{}).get('pages',{})
            permitted={'CC0','Public domain','Public Domain','CC BY 4.0','CC BY 3.0','CC BY 2.0','CC BY-SA 4.0','CC BY-SA 3.0','CC BY-SA 2.0'}
            candidates=[]
            for page in data.values():
              info=(page.get('imageinfo') or [{}])[0]; meta=info.get('extmetadata',{})
              lic=re.sub('<[^>]+>',' ',meta.get('LicenseShortName',{}).get('value','')).strip()
              url=info.get('url','')
              if lic in permitted and url and url.lower().split('?')[0].endswith(('.jpg','.jpeg','.png','.webp')):
                candidates.append({'url':url,'page':info.get('descriptionurl',''),'license':lic,'title':page.get('title',''),'artist':meta.get('Artist',{}).get('value','')})
            saved=None
            for c in candidates[:8]:
              try:
                req2=urllib.request.Request(c['url'],headers={'User-Agent':'RealVideoEngine/1.0'})
                raw=urllib.request.urlopen(req2,timeout=30).read()
                if len(raw)<1500: continue
                ext='.jpg' if '.jpg' in c['url'].lower() or '.jpeg' in c['url'].lower() else ('.png' if '.png' in c['url'].lower() else '.webp')
                dest=Path(f'output/assets/scene{i:02}{ext}');dest.write_bytes(raw)
                import subprocess
                v=subprocess.run(['ffmpeg','-v','error','-i',str(dest),'-frames:v','1','-f','null','-'],capture_output=True)
                if v.returncode: dest.unlink(missing_ok=True);continue
                c['local']=str(dest);c['bytes']=len(raw);saved=c;break
              except Exception: continue
            if not saved:
              raise RuntimeError(f'No valid licensed Commons image downloaded for scene {i}')
            scenes.append({'scene':i,'narration':chunk,'asset':saved})
          Path('output/report/assets.json').write_text(json.dumps(scenes,indent=2,ensure_ascii=False))
          Path('output/scenes.txt').write_text(json.dumps([s['asset']['local'] for s in scenes]),encoding='utf-8')
          PY
      - name: Render image scenes, narration, subtitles and final MP4
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          scenes=json.loads(Path('output/report/assets.json').read_text())
          audio=Path('output/narration.wav')
          dur=float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',str(audio)]))
          per=dur/max(1,len(scenes))
          srt=[]
          for i,s in enumerate(scenes):
            start=i*per;end=(i+1)*per
            def stamp(x):
              ms=int(x*1000);h,ms=divmod(ms,3600000);m,ms=divmod(ms,60000);sec,ms=divmod(ms,1000);return f'{h:02}:{m:02}:{sec:02},{ms:03}'
            srt.append(f'{i+1}\n{stamp(start)} --> {stamp(end)}\n{s["narration"]}\n')
            seg=Path(f'output/scene{i+1:02}.mp4')
            cmd=['ffmpeg','-y','-loop','1','-i',s['asset']['local'],'-t',str(per),'-vf','scale=720:1280:force_original_aspect_ratio=increase,crop=720:1280,zoompan=z=min(zoom+0.0006,1.08):x=iw/2-iw/zoom/2:y=ih/2-ih/zoom/2:d=1:s=720x1280:fps=24','-an','-c:v','libx264','-preset','ultrafast','-crf','24','-pix_fmt','yuv420p',str(seg)]
            subprocess.run(cmd,check=True)
          Path('output/subtitles.srt').write_text('\n'.join(srt))
          Path('output/concat.txt').write_text('\n'.join("file '"+str(Path(f'output/scene{i+1:02}.mp4').resolve())+"'" for i in range(len(scenes)))+'\n')
          subprocess.run(['ffmpeg','-y','-f','concat','-safe','0','-i','output/concat.txt','-c','copy','output/video_only.mp4'],check=True)
          subprocess.run(['ffmpeg','-y','-i','output/video_only.mp4','-i','output/narration.wav','-i','output/subtitles.srt','-map','0:v','-map','1:a','-map','2:s','-c:v','copy','-c:a','aac','-b:a','160k','-c:s','mov_text','-shortest','-movflags','+faststart','output/final.mp4'],check=True)
          PY
      - name: Verify output
        run: |
          ffprobe -v error -show_streams -show_format output/final.mp4 > output/report/probe.json
          test -s output/final.mp4
          echo "MP4 created and ffprobe verified" > output/report/QC.txt
      - name: Upload actual video
        uses: actions/upload-artifact@v4
        with:
          name: real-video-production
          path: output/
          retention-days: 7
